<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tea" [routerLink]="['/community/tea']">
      <ion-icon name="flame-outline"></ion-icon>
      <ion-label>Tea</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="threads" [routerLink]="['/community/threads']">
      <ion-icon name="newspaper-outline"></ion-icon>
      <ion-label>Threads</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="home" [routerLink]="['/tabs/home']">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="messages" [routerLink]="['/community/messages']">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <ion-label>Messages</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" [routerLink]="['/community/profile']">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>

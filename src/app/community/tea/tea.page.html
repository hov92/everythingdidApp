<ion-content class="tea">

  <!-- Pull to refresh -->
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content pullingText="Pull to refresh"></ion-refresher-content>
  </ion-refresher>

  <!-- Composer -->
  <div class="composer">
    <div class="composer-card">

      <div class="composer-row">
        <ion-icon class="me-icon" name="person-circle-outline"></ion-icon>

        <ion-textarea
          class="composer-input"
          [(ngModel)]="text"
          autoGrow="true"
          placeholder="What’s the tea?"
        ></ion-textarea>

        <ion-button
          class="post-btn"
          size="small"
          (click)="post()"
          [disabled]="loading || (!text.trim() && !attachments.length)"
        >
          Post
        </ion-button>
      </div>

      <!-- Attachment previews (local only) -->
      <div class="attachments" *ngIf="attachments.length">
        <div class="chip" *ngFor="let a of attachments; let i = index">
          <img *ngIf="a.kind === 'image'" [src]="a.url" alt="" />
          <video *ngIf="a.kind === 'video'" [src]="a.url" muted playsinline></video>

          <ion-button fill="clear" class="remove" (click)="removeAttachment(i)">
            <ion-icon name="close-circle"></ion-icon>
          </ion-button>
        </div>
      </div>

      <div class="composer-actions">
        <input
          #fileInput
          type="file"
          accept="image/*,video/*"
          multiple
          hidden
          (change)="onFilesSelected($event)"
        />

        <ion-button fill="clear" class="attach" (click)="onPickMediaClick(fileInput)">
          <ion-icon slot="start" name="image-outline"></ion-icon>
          Media
        </ion-button>

        <div class="hint" *ngIf="!attachments.length && !text.trim()">Be kind. Keep it real.</div>
      </div>

      <div class="error" *ngIf="error">{{ error }}</div>
    </div>
  </div>

  <!-- Loading state -->
  <div class="busy" *ngIf="loading && !feed.length">
    <ion-spinner></ion-spinner>
    <div>Loading…</div>
  </div>

  <!-- Feed -->
  <div class="feed">
    <div class="card" *ngFor="let item of feed">

      <!-- Header -->
      <div class="head">
        <div class="left">
          <img class="avatar" [src]="avatarOf(item)" alt="" />
          <div class="meta">
            <div class="author">{{ authorOf(item) }}</div>
            <div class="time" *ngIf="dateOf(item)">{{ dateOf(item) | date:'short' }}</div>
          </div>
        </div>

        <ion-button fill="clear" size="small" class="icon-btn" (click)="openShare(item)">
          <ion-icon name="ellipsis-horizontal"></ion-icon>
        </ion-button>
      </div>

      <!-- Text/HTML content -->
      <div class="body" [innerHTML]="contentHtmlOf(item)"></div>

      <!-- Media (IG carousel frame) -->
      <div class="media" *ngIf="mediaOf(item).length">
        <div class="media-track" [class.single]="mediaOf(item).length === 1">
          <div
            class="media-frame"
            *ngFor="let m of mediaOf(item)"
            [class.is-video]="m.kind === 'video'"
          >
            <img
              *ngIf="m.kind === 'image'"
              class="media-img"
              [src]="mediaSrc(m.url)"
              alt=""
              loading="lazy"
            />

            <video
              *ngIf="m.kind === 'video'"
              class="media-video"
              [src]="mediaSrc(m.url)"
              autoplay
              muted
              loop
              playsinline
              preload="metadata"
            ></video>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="a-btn" type="button" (click)="toggleLike(item)">
          <ion-icon [name]="isLiked(item) ? 'heart' : 'heart-outline'"></ion-icon>
          <span>Like</span>
        </button>

        <button class="a-btn" type="button" (click)="openThread(item)">
          <ion-icon name="chatbubble-outline"></ion-icon>
          <span>Comment</span>
        </button>

        <button class="a-btn" type="button" (click)="openShare(item)">
          <ion-icon name="share-outline"></ion-icon>
          <span>Share</span>
        </button>
      </div>

    </div>

    <div class="empty" *ngIf="!loading && !feed.length && !error">
      No posts yet.
    </div>
  </div>

</ion-content>

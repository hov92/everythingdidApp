<ion-content class="ion-padding">
  <h2>Shop</h2>

  <p *ngIf="loading">Loading...</p>
  <p *ngIf="error" style="color:#ff6b6b;">{{ error }}</p>

  <ion-grid>
    <ion-row>
      <ion-col size="6" sizeMd="4" sizeLg="3" *ngFor="let p of products">
        <ion-card>
          <ion-img [src]="p.images?.[0]?.src"></ion-img>
          <ion-card-header>
            <ion-card-title style="font-size: 14px;">{{ p.name }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>{{ price(p) }}</ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

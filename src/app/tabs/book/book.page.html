<ion-content class="ion-padding">
  <h2>Book</h2>

  <p *ngIf="loading">Loading...</p>
  <p *ngIf="error" style="color:#ff6b6b;">{{ error }}</p>

  <ion-list>
    <ion-item *ngFor="let s of services">
      <ion-label>
        <h3>{{ s.name }}</h3>
        <p>{{ s.vendor }}</p>
      </ion-label>
      <ion-button slot="end" (click)="book(s.id)">Book</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
